[workspace]
members = ["risuko-engine", "risuko-bt", "risuko-cli", "risuko-napi", "risuko-http", "risuko-cookies"]

[workspace.package]
version = "0.4.2"
authors = ["YueMiyuki"]
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
risuko-engine = { path = "risuko-engine" }
risuko-bt = { path = "risuko-bt" }
risuko-http = { path = "risuko-http" }
risuko-cookies = { path = "risuko-cookies" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros", "signal", "io-util"] }
log = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive"] }

[package]
name = "risuko"
version.workspace = true
description = "A full-featured download manager"
authors.workspace = true
edition.workspace = true

[lib]
name = "risuko_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"

[dependencies]
risuko-engine = { workspace = true }
tauri = { version = "2", features = [
	"tray-icon",
	"image-png",
	"macos-private-api",
] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
open = "5"
tauri-plugin-clipboard-manager = "2.3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1.12.4"
risuko-http = { workspace = true }
risuko-cookies = { workspace = true }
base64 = "0.22"
sha1 = "0.11"
sha2 = "0.11"
urlencoding = "2"
keyring-core = "1"
fs4 = "1"
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"
tauri-plugin-nosleep = { git = "https://github.com/pevers/tauri-plugin-nosleep", rev = "6f6ab76ec171d075476b585282290fcf2e1c40b5" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
# JNI bridge so we can dispatch Android `Intent`s with explicit MIME types
# and `Intent.createChooser`. `tauri-plugin-shell::open` only calls
# `Intent(ACTION_VIEW, uri)` with no extras, which lets generic
# wildcard-MIME apps like Messages intercept any content URI we send.
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
