[package]
name = "risuko-bt"
version = "0.1.0"
description = "BitTorrent v1 engine used by Risuko (in-tree replacement for librqbit)"
authors = ["YueMiyuki"]
edition = "2021"
license = "MIT"

[lib]
name = "risuko_bt"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "net", "macros", "io-util", "fs"] }
parking_lot = "0.12"
thiserror = "2"
percent-encoding = "2"
bytes = "1"
byteorder = "1"
hex = "0.4"
sha1 = "0.11"
rand = "0.10"
log = "0.4"
arc-swap = "1"
once_cell = "1"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
socket2 = "0.6"
url = "2"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
