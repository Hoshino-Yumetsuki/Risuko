[package]
name = "risuko-engine"
version = "0.1.5"
description = "Risuko download engine — multi-protocol download library"
authors = ["YueMiyuki"]
edition = "2021"
license = "MIT"

[lib]
name = "risuko_engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros"] }
log = "0.4"
dirs = "6"
sha1 = "0.11"
sha2 = "0.11"
librqbit = { git = "https://github.com/ikatson/rqbit.git", tag = "v9.0.0-beta.2" }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-util = "0.3"
rand = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
reqwest = { version = "0.13", features = ["stream", "gzip", "brotli", "deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
url = "2"
filetime = "0.2"
m3u8-rs = "6.0.0"
aes = "0.9"
cbc = "0.2"
feed-rs = "2.3.1"
regex = "1.12.3"
urlencoding = "2.1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
suppaftp = { version = "8", features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "0.56", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2"

[dev-dependencies]
tempfile = "3"
