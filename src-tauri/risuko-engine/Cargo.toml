[package]
name = "risuko-engine"
version.workspace = true
description = "Risuko download engine — multi-protocol download library"
authors = ["YueMiyuki"]
edition = "2021"
license = "MIT"

[lib]
name = "risuko_engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros", "io-util", "fs"] }
byteorder = "1"
hex = "0.4"
parking_lot = "0.12"
thiserror = "2"
socket2 = "0.6"
percent-encoding = "2"
log = "0.4"
dirs = "6"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
digest = "0.11"
hmac = "0.13"
risuko-bt = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-util = "0.3"
rand = "0.10"
tiger = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
risuko-http = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
bytes = "1"
url = "2"
filetime = "0.2"
m3u8-rs = "6.0.0"
aes = "0.9"
cbc = "0.2"
feed-rs = "2.3.1"
regex = "1.12.3"
urlencoding = "2.1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
suppaftp = { version = "8", features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "0.56", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
